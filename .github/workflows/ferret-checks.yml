# Ferret: type-check every push to main (and pull requests), so problems show
# up long before a release is tagged.
name: Ferret Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  types:
    name: Type check
    runs-on: windows-latest

    steps:
      - name: Checkout (with web + SDK submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Ferret web client
        run: pnpm web:build

      - name: Type check
        run: node scripts/check-types.mjs
